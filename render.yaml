# Render "Blueprint": New > Blueprint > pick this repository. Secrets are entered in the dashboard.
services:
  - type: web
    name: beyond-clicks-study
    runtime: python
    plan: free
    region: singapore   # same region as the Neon database (fast queries)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
